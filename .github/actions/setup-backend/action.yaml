name: 'Setup Backend Environment'
description: 'Sets up Python, caches Pipenv virtual environment, and installs dependencies'

inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.10'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pipenv'
        cache-dependency-path: starter/backend/Pipfile.lock

    - name: Install dependencies
      shell: bash
      working-directory: starter/backend
      env:
        CFLAGS: "-Wno-error=incompatible-pointer-types -std=gnu17"
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev libpcre3 libpcre3-dev
        pip install pipenv
        pipenv install --dev || pipenv install --dev --skip-lock
