name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_run:
    workflows: ["Backend Continuous Deployment"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint Frontend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  test:
    name: Test Frontend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18.14'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm test

  build-and-deploy:
    name: Build, Push and Deploy Frontend
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure Frontend ECR Repository
        run: |
          aws ecr describe-repositories --repository-names frontend 2>/dev/null || \
          aws ecr create-repository --repository-name frontend --image-scanning-configuration scanOnPush=true || true

      - name: Get Backend URL
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

          echo "Querying backend service LoadBalancer hostname..."
          for i in $(seq 1 30); do
            BACKEND_HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$BACKEND_HOST" ]; then
              echo "Found Backend LoadBalancer Hostname: $BACKEND_HOST"
              break
            fi
            echo "Waiting for LoadBalancer hostname to be assigned ($i/30)..."
            sleep 5
          done

          if [ -z "$BACKEND_HOST" ]; then
            echo "LoadBalancer hostname pending, checking for ingress IP..."
            BACKEND_HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          fi

          if [ -z "$BACKEND_HOST" ]; then
            echo "No ingress IP found yet, using localhost:5000 fallback"
            BACKEND_HOST="localhost:5000"
          fi

          echo "REACT_APP_MOVIE_API_URL=http://$BACKEND_HOST" >> $GITHUB_ENV
          echo "Configured REACT_APP_MOVIE_API_URL=http://$BACKEND_HOST"

      - name: Build Docker Image
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          fi
          echo "Building frontend Docker image using registry: $REGISTRY"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=${{ env.REACT_APP_MOVIE_API_URL }} \
            --tag "$REGISTRY/frontend:${{ github.sha }}" \
            --tag "$REGISTRY/frontend:latest" \
            .

      - name: Push Docker Image to Amazon ECR
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          fi
          echo "Pushing frontend Docker image to $REGISTRY"
          docker push "$REGISTRY/frontend:${{ github.sha }}"
          docker push "$REGISTRY/frontend:latest"

      - name: Deploy to Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

          # Clean up any stale NotReady nodes that no longer exist
          for dead_node in $(kubectl get nodes --no-headers 2>/dev/null | awk '$2 ~ /NotReady/ {print $1}'); do
            echo "Cleaning up stale NotReady node: $dead_node"
            kubectl delete node "$dead_node" 2>/dev/null || true
          done

          echo "Waiting up to 300s for a Ready worker node..."
          for i in $(seq 1 30); do
            READY_NODES=$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep -cx "True" || true)
            if [ "$READY_NODES" -gt 0 ]; then
              echo "Worker node is Ready ($READY_NODES ready)!"
              kubectl get nodes -o wide
              break
            fi
            echo "Waiting for worker node to be Ready ($i/30)..."
            sleep 10
          done

          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          fi

          cd k8s
          kustomize edit set image frontend="$REGISTRY/frontend:${{ github.sha }}"
          kustomize build | kubectl apply --validate=false -f -

          echo "=== CHECKING ROLLOUT STATUS ==="
          if ! kubectl rollout status deployment/frontend --timeout=300s; then
            echo "=== ROLLOUT TIMEOUT DIAGNOSTICS ==="
            kubectl get nodes -o wide || true
            kubectl get pods -A -o wide || true
            kubectl describe pods -l app=frontend || true
            kubectl logs -l app=frontend --all-containers=true --tail=100 || true
            kubectl get events --sort-by='.lastTimestamp' | tail -n 30 || true
            exit 1
          fi

          echo "=== FRONTEND DEPLOYMENT SUCCESSFUL ==="
          kubectl get service frontend -o wide
          kubectl get pods -l app=frontend -o wide
          kubectl get services -o wide
          kubectl get deployments -o wide

      - name: Save Diagnostics & Step Summary
        if: always()
        run: |
          FRONTEND_HOST=$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          BACKEND_HOST=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

          echo "## 🎬 Movie Picture Pipeline Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend UI** | [http://$FRONTEND_HOST](http://$FRONTEND_HOST) | ✅ Live |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | [http://$BACKEND_HOST/movies](http://$BACKEND_HOST/movies) | ✅ Live |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Kubernetes Resources" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "--- SERVICES ---" >> $GITHUB_STEP_SUMMARY
          kubectl get services -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- PODS ---" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "--- DEPLOYMENTS ---" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          {
            echo "=== CLUSTER DEPLOYMENT STATUS ==="
            echo "Frontend URL: http://$FRONTEND_HOST"
            echo "Backend URL: http://$BACKEND_HOST/movies"
            echo ""
            echo "--- SERVICES ---"
            kubectl get services -o wide 2>&1 || true
            echo ""
            echo "--- PODS ---"
            kubectl get pods -o wide 2>&1 || true
            echo ""
            echo "--- DEPLOYMENTS ---"
            kubectl get deployments -o wide 2>&1 || true
          } > "$GITHUB_WORKSPACE/diagnostics.log"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          cd "$GITHUB_WORKSPACE"
          git add diagnostics.log || true
          git commit -m "chore(debug): capture live cluster diagnostics [skip ci]" || true
          git push origin main || true

      - name: Upload Rollout Diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-diagnostics
          path: starter/frontend/diagnostics.log
          if-no-files-found: ignore
