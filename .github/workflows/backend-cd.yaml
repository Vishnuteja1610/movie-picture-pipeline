name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint Backend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3-dev
          pip install pipenv
          pipenv install --dev

      - name: Run linting
        run: pipenv run lint

  test:
    name: Test Backend
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3-dev
          pip install pipenv
          pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build-and-deploy:
    name: Build, Push and Deploy Backend
    needs: [lint, test]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure Backend ECR Repository
        run: |
          aws ecr describe-repositories --repository-names backend 2>/dev/null || \
          aws ecr create-repository --repository-name backend --image-scanning-configuration scanOnPush=true || true

      - name: Build Docker Image
        run: |
          docker build \
            --tag ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }} \
            --tag ${{ steps.login-ecr.outputs.registry }}/backend:latest \
            .

      - name: Push Docker Image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:latest

      - name: Ensure Healthy Bottlerocket Worker Nodes
        run: |
          exec > >(tee -a diagnostics.log) 2>&1
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account ID: $ACCOUNT_ID"

          # 1. Authorize worker node role via EKS Access Entry (for API_AND_CONFIG_MAP mode)
          echo "Configuring EKS access entry for worker node role..."
          aws eks create-access-entry \
            --cluster-name ${{ env.EKS_CLUSTER_NAME }} \
            --principal-arn "arn:aws:iam::$ACCOUNT_ID:role/udacity-node-group" \
            --type EC2_LINUX 2>/dev/null || true

          # 2. Configure aws-auth ConfigMap
          echo "Applying aws-auth ConfigMap..."
          sed "s/ACCOUNT_ID/$ACCOUNT_ID/g" $GITHUB_WORKSPACE/setup/aws-auth-patch.yaml | kubectl apply -f - || true

          # 3. Check for Ready nodes
          READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || true)
          echo "Currently ready nodes: $READY_NODES"

          if [ "$READY_NODES" -eq 0 ]; then
            EXISTING_NGS=$(aws eks list-nodegroups --cluster-name ${{ env.EKS_CLUSTER_NAME }} --query "nodegroups[*]" --output text 2>/dev/null || true)
            echo "Existing nodegroups: $EXISTING_NGS"

            if ! echo "$EXISTING_NGS" | grep -qw "udacity-bottlerocket"; then
              SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=udacity-public" --query "Subnets[0].SubnetId" --output text)
              echo "Creating Bottlerocket node group 'udacity-bottlerocket' in subnet $SUBNET_ID..."
              aws eks create-nodegroup \
                --cluster-name ${{ env.EKS_CLUSTER_NAME }} \
                --nodegroup-name udacity-bottlerocket \
                --scaling-config minSize=1,maxSize=1,desiredSize=1 \
                --subnets "$SUBNET_ID" \
                --instance-types t3.small \
                --ami-type BOTTLEROCKET_x86_64 \
                --node-role "arn:aws:iam::$ACCOUNT_ID:role/udacity-node-group" || true

              # Clean up old AL2023 node group if present
              if echo "$EXISTING_NGS" | grep -qw "udacity"; then
                echo "Deleting old node group 'udacity'..."
                aws eks delete-nodegroup --cluster-name ${{ env.EKS_CLUSTER_NAME }} --nodegroup-name udacity 2>/dev/null || true
              fi
            fi

            echo "=== DESCRIBING NODEGROUPS ==="
            for ng in $(aws eks list-nodegroups --cluster-name ${{ env.EKS_CLUSTER_NAME }} --query "nodegroups[*]" --output text 2>/dev/null); do
              echo "--- Nodegroup: $ng ---"
              aws eks describe-nodegroup --cluster-name ${{ env.EKS_CLUSTER_NAME }} --nodegroup-name "$ng" --query "nodegroup.[status,amiType,health.issues]" --output json || true
            done

            echo "Waiting up to 480s for Bottlerocket node to become Ready..."
            for i in $(seq 1 48); do
              READY_NODES=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "Ready" || true)
              if [ "$READY_NODES" -gt 0 ]; then
                echo "Worker node is Ready!"
                kubectl get nodes -o wide
                break
              fi
              echo "Waiting for node ($i/48)..."
              sleep 10
            done
          fi

          if [ "$READY_NODES" -eq 0 ]; then
            echo "ERROR: No worker node became Ready within timeout!"
            echo "--- EKS NODEGROUPS ---"
            aws eks list-nodegroups --cluster-name ${{ env.EKS_CLUSTER_NAME }} || true
            for ng in $(aws eks list-nodegroups --cluster-name ${{ env.EKS_CLUSTER_NAME }} --query "nodegroups[*]" --output text 2>/dev/null); do
              aws eks describe-nodegroup --cluster-name ${{ env.EKS_CLUSTER_NAME }} --nodegroup-name "$ng" || true
            done
            echo "--- K8S NODES & EVENTS ---"
            kubectl get nodes -o wide || true
            kubectl get events --sort-by='.lastTimestamp' | tail -n 30 || true
            exit 1
          fi

          echo "Cluster Nodes:"
          kubectl get nodes -o wide || true

      - name: Deploy to Amazon EKS
        run: |
          exec > >(tee -a diagnostics.log) 2>&1
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

          echo "=== KUBERNETES NODES ==="
          kubectl get nodes -o wide || true

          cd k8s
          kustomize edit set image backend=${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}
          kustomize build | kubectl apply --validate=false -f -

          echo "=== CHECKING ROLLOUT STATUS ==="
          if ! kubectl rollout status deployment/backend --timeout=300s; then
            echo "=== ROLLOUT TIMEOUT DIAGNOSTICS ==="
            echo "--- NODES ---"
            kubectl get nodes -o wide || true
            echo "--- PODS ---"
            kubectl get pods -A -o wide || true
            echo "--- BACKEND POD DETAILS ---"
            kubectl describe pods -l app=backend || true
            echo "--- BACKEND POD LOGS ---"
            kubectl logs -l app=backend --all-containers=true --tail=100 || true
            echo "--- CLUSTER RECENT EVENTS ---"
            kubectl get events --sort-by='.lastTimestamp' | tail -n 30 || true
            exit 1
          fi

          echo "=== BACKEND DEPLOYMENT SUCCESSFUL ==="
          kubectl get service backend -o wide
          kubectl get pods -l app=backend -o wide

      - name: Upload Rollout Diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-diagnostics
          path: starter/backend/diagnostics.log
