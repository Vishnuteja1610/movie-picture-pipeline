name: Deploy Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: setup/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect Supported EKS Version & Cleanup Orphaned Resources
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS Account ID: $ACCOUNT_ID"

          # Query available EKS versions in us-east-1
          SUPPORTED_VERSIONS=$(aws eks describe-addon-versions --query "addons[0].addonVersions[0].compatibilities[*].clusterVersion" --output text 2>/dev/null | tr '\t' '\n' | sort -V | grep -v '^$' || true)
          echo "Supported EKS versions in region: $SUPPORTED_VERSIONS"

          TARGET_VERSION="1.35"
          if [ -n "$SUPPORTED_VERSIONS" ]; then
            if echo "$SUPPORTED_VERSIONS" | grep -qx "1.35"; then
              TARGET_VERSION="1.35"
            else
              TARGET_VERSION=$(echo "$SUPPORTED_VERSIONS" | tail -n 1)
            fi
          fi
          echo "Selected Kubernetes Version: $TARGET_VERSION"
          echo "K8S_VERSION=$TARGET_VERSION" >> $GITHUB_ENV

          # Ensure ECR repositories exist
          aws ecr describe-repositories --repository-names frontend 2>/dev/null || aws ecr create-repository --repository-name frontend --image-scanning-configuration scanOnPush=true || true
          aws ecr describe-repositories --repository-names backend 2>/dev/null || aws ecr create-repository --repository-name backend --image-scanning-configuration scanOnPush=true || true

          # Cleanup partial VPC if no cluster was provisioned
          CLUSTER_STATUS=$(aws eks describe-cluster --name cluster --query "cluster.status" --output text 2>/dev/null || true)
          if [ "$CLUSTER_STATUS" != "ACTIVE" ] && [ "$CLUSTER_STATUS" != "CREATING" ]; then
            VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=udacity" --query "Vpcs[0].VpcId" --output text 2>/dev/null || true)
            if [ "$VPC_ID" != "None" ] && [ -n "$VPC_ID" ]; then
              echo "Cleaning up unassociated partial VPC: $VPC_ID"
              for sub in $(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query "Subnets[*].SubnetId" --output text 2>/dev/null); do
                aws ec2 delete-subnet --subnet-id "$sub" 2>/dev/null || true
              done
              for igw in $(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query "InternetGateways[*].InternetGatewayId" --output text 2>/dev/null); do
                aws ec2 detach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$VPC_ID" 2>/dev/null || true
                aws ec2 delete-internet-gateway --internet-gateway-id "$igw" 2>/dev/null || true
              done
              for rtb in $(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" --query "RouteTables[?Associations[0].Main!=true].RouteTableId" --output text 2>/dev/null); do
                for assoc in $(aws ec2 describe-route-tables --route-table-ids "$rtb" --query "RouteTables[0].Associations[*].RouteTableAssociationId" --output text 2>/dev/null); do
                  aws ec2 disassociate-route-table --association-id "$assoc" 2>/dev/null || true
                done
                aws ec2 delete-route-table --route-table-id "$rtb" 2>/dev/null || true
              done
              aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null || true
            fi
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        run: terraform init

      - name: Deploy or Verify Infrastructure
        run: |
          CLUSTER_STATUS=$(aws eks describe-cluster --name cluster --query "cluster.status" --output text 2>/dev/null || true)
          echo "Cluster status: $CLUSTER_STATUS"

          if [ "$CLUSTER_STATUS" = "ACTIVE" ]; then
            echo "✅ EKS Cluster 'cluster' is already ACTIVE and running!"
            echo "Infrastructure is already provisioned. Performing health and state reconciliation..."

            # 1. Ensure ECR repos exist
            aws ecr describe-repositories --repository-names frontend 2>/dev/null || aws ecr create-repository --repository-name frontend --image-scanning-configuration scanOnPush=true || true
            aws ecr describe-repositories --repository-names backend 2>/dev/null || aws ecr create-repository --repository-name backend --image-scanning-configuration scanOnPush=true || true

            # 2. Ensure IAM roles exist and are configured
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            aws iam get-role --role-name eks_cluster_role 2>/dev/null || \
              aws iam create-role --role-name eks_cluster_role --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' || true
            aws iam attach-role-policy --role-name eks_cluster_role --policy-arn "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy" || true
            aws iam attach-role-policy --role-name eks_cluster_role --policy-arn "arn:aws:iam::aws:policy/AmazonEKSServicePolicy" || true

            aws iam get-role --role-name udacity-node-group 2>/dev/null || \
              aws iam create-role --role-name udacity-node-group --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"sts:AssumeRole"}]}' || true
            aws iam attach-role-policy --role-name udacity-node-group --policy-arn "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy" || true
            aws iam attach-role-policy --role-name udacity-node-group --policy-arn "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy" || true
            aws iam attach-role-policy --role-name udacity-node-group --policy-arn "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly" || true

            # 3. Ensure Bottlerocket node group exists and is active
            NGS=$(aws eks list-nodegroups --cluster-name cluster --query "nodegroups[*]" --output text 2>/dev/null || true)
            if ! echo "$NGS" | grep -qw "udacity-bottlerocket"; then
              SUBNET_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=udacity-public" --query "Subnets[0].SubnetId" --output text 2>/dev/null || true)
              if [ -z "$SUBNET_ID" ] || [ "$SUBNET_ID" = "None" ]; then
                SUBNET_ID=$(aws eks describe-cluster --name cluster --query "cluster.resourcesVpcConfig.subnetIds[0]" --output text)
              fi
              echo "Creating Bottlerocket node group in $SUBNET_ID..."
              aws eks create-nodegroup \
                --cluster-name cluster \
                --nodegroup-name udacity-bottlerocket \
                --scaling-config minSize=1,maxSize=1,desiredSize=1 \
                --subnets "$SUBNET_ID" \
                --instance-types t3.small \
                --ami-type BOTTLEROCKET_x86_64 \
                --node-role "arn:aws:iam::$ACCOUNT_ID:role/udacity-node-group" || true
            fi

            # 4. Authorize worker node role via EKS Access Entry
            aws eks create-access-entry \
              --cluster-name cluster \
              --principal-arn "arn:aws:iam::$ACCOUNT_ID:role/udacity-node-group" \
              --type EC2_LINUX 2>/dev/null || true

            # 5. Update kubeconfig and apply aws-auth
            aws eks update-kubeconfig --name cluster --region ${{ env.AWS_REGION }}
            sed "s/ACCOUNT_ID/$ACCOUNT_ID/g" $GITHUB_WORKSPACE/setup/aws-auth-patch.yaml | kubectl apply -f - || true

            echo "### 🏗️ Infrastructure Status: Healthy & Active" >> $GITHUB_STEP_SUMMARY
            echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **EKS Cluster** | ✅ ACTIVE | Version: $(aws eks describe-cluster --name cluster --query 'cluster.version' --output text) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Nodegroup** | ✅ ACTIVE | udacity-bottlerocket (Bottlerocket OS) |" >> $GITHUB_STEP_SUMMARY
            echo "| **ECR Repositories** | ✅ Ready | frontend, backend |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            echo "--- NODES ---" >> $GITHUB_STEP_SUMMARY
            kubectl get nodes -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo "--- SERVICES ---" >> $GITHUB_STEP_SUMMARY
            kubectl get services -o wide >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY

          else
            echo "EKS Cluster is not active. Initializing and running terraform apply..."
            terraform apply -auto-approve -var="k8s_version=${{ env.K8S_VERSION }}"
          fi

      - name: Save Terraform State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-state
          path: setup/terraform/terraform.tfstate
          retention-days: 5
          if-no-files-found: ignore

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name cluster --region ${{ env.AWS_REGION }}

      - name: Configure aws-auth ConfigMap
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Configuring aws-auth for Account ID: $ACCOUNT_ID"
          sed "s/ACCOUNT_ID/$ACCOUNT_ID/g" ../aws-auth-patch.yaml | kubectl apply -f - || true
