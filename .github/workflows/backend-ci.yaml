name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types -std=gnu17"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libpcre3 libpcre3-dev
          pip install pipenv
          pipenv install --dev || pipenv install --dev --skip-lock

      - name: Run linting
        run: pipenv run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types -std=gnu17"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libpcre3 libpcre3-dev
          pip install pipenv
          pipenv install --dev || pipenv install --dev --skip-lock

      - name: Run tests
        run: pipenv run test

  build:
    name: Build Backend Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --tag backend:latest \
            .
